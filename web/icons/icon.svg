<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A243B" />
      <stop offset="100%" stop-color="#070A10" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#FF0077" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Outer Glow Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.6" />

  <!-- Dual Light Center Emblem -->
  <!-- Strip wave line -->
  <path d="M 140 330 C 190 280, 220 380, 270 330 C 320 280, 350 360, 380 320" 
        fill="none" stroke="#00F0FF" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Bulb / Lightning bolt in center -->
  <polygon points="275,120 195,260 255,260 235,380 325,240 265,240" fill="url(#neonGrad)" filter="url(#glow)" />

  <!-- Small star sparkles -->
  <circle cx="160" cy="180" r="6" fill="#00F0FF" />
  <circle cx="360" cy="190" r="8" fill="#FF0077" />
  <circle cx="340" cy="380" r="5" fill="#FFBB00" />
</svg>
